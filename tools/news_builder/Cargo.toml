[package]
name = "macready-news-builder"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
