<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        color: #f5f7fb;
        font-family: "Inter", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }

      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      .scene-content {
        position: relative;
        z-index: 4;
        display: flex;
        width: 100%;
        height: 100%;
        padding: 88px 104px;
      }

      .full-center {
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
      }

      .black-fade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.36) 42%, rgba(0, 0, 0, 0.72)),
          linear-gradient(0deg, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.1) 42%, rgba(0, 0, 0, 0.82));
      }

      .soft-bg {
        position: absolute;
        inset: -80px;
        background-size: cover;
        background-position: center;
        filter: blur(34px) saturate(1.1) brightness(0.42);
        transform: scale(1.1);
      }

      .bg-overview {
        background-image: url("assets/screens/01-overview.png");
      }

      .bg-games {
        background-image: url("assets/screens/02-games.png");
      }

      .bg-apps {
        background-image: url("assets/screens/03-app-store.png");
      }

      .bg-wallpaper {
        background-image: url("assets/screens/04-wallpaper.png");
      }

      .bg-assistant {
        background-image: url("assets/screens/05-assistant.png");
      }

      .product-frame {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow:
          0 52px 160px rgba(0, 0, 0, 0.76),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .product-frame img,
      .crop-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .hero-frame {
        width: 1420px;
        height: 799px;
      }

      .wide-frame {
        width: 1320px;
        height: 742px;
      }

      .cinema-frame {
        position: absolute;
        left: 120px;
        top: 124px;
        width: 1680px;
        height: 840px;
      }

      .crop-frame {
        position: absolute;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.05);
        box-shadow:
          0 48px 150px rgba(0, 0, 0, 0.72),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .copy-line {
        position: absolute;
        z-index: 8;
        max-width: 980px;
        color: #f5f7fb;
        font-family: "Outfit", sans-serif;
        font-size: 78px;
        font-weight: 740;
        line-height: 0.98;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .small-line {
        position: absolute;
        z-index: 8;
        max-width: 820px;
        color: rgba(245, 247, 251, 0.78);
        font-size: 31px;
        font-weight: 360;
        line-height: 1.18;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .wordmark {
        font-family: "Outfit", sans-serif;
        font-size: 132px;
        font-weight: 760;
        line-height: 0.96;
        letter-spacing: 0;
      }

      .tagline {
        margin-top: 28px;
        color: rgba(245, 247, 251, 0.78);
        font-size: 34px;
        font-weight: 360;
      }

      .micro {
        margin-bottom: 18px;
        color: rgba(245, 247, 251, 0.7);
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .dock {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px 24px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 31px;
        background: rgba(12, 21, 40, 0.72);
        box-shadow:
          0 36px 90px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(30px) saturate(1.6);
      }

      .dock img {
        width: 74px;
        height: 74px;
        border-radius: 18px;
      }

      .thread {
        position: absolute;
        z-index: 7;
        height: 1px;
        width: 720px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(245, 247, 251, 0.48), rgba(255, 255, 255, 0));
      }

      .veil {
        position: absolute;
        inset: 0;
        z-index: 40;
        opacity: 0;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(28px) saturate(1.4);
        pointer-events: none;
      }

      #s2-text {
        left: 132px;
        bottom: 128px;
      }

      #s2-sub {
        left: 136px;
        bottom: 78px;
      }

      #s3-text {
        left: 124px;
        top: 142px;
      }

      #s4-text {
        right: 128px;
        bottom: 132px;
        text-align: right;
      }

      #s5-text {
        left: 128px;
        bottom: 130px;
      }

      #s6-text {
        right: 138px;
        top: 144px;
        width: 610px;
        text-align: right;
      }

      #s3-crop {
        left: 88px;
        top: 278px;
        width: 1744px;
        height: 642px;
      }

      #s3-crop img {
        object-position: center 42%;
      }

      #s4-crop {
        left: 88px;
        top: 94px;
        width: 1360px;
        height: 792px;
      }

      #s4-crop img {
        object-position: center center;
      }

      #s5-crop {
        right: 96px;
        top: 92px;
        width: 1320px;
        height: 742px;
      }

      #s5-crop img {
        object-position: center center;
      }

      #s6-settings {
        left: 118px;
        top: 160px;
        width: 760px;
        height: 620px;
      }

      #s6-settings img {
        object-position: center center;
      }

      #s6-assistant {
        right: 132px;
        bottom: 120px;
        width: 820px;
        height: 500px;
      }

      #s6-assistant img {
        object-position: right top;
      }

      #s7-dock {
        margin-bottom: 44px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="scene-1" class="scene clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div class="soft-bg bg-overview" id="s1-bg" data-layout-ignore></div>
        <div class="black-fade" id="s1-fade"></div>
        <div class="scene-content full-center">
          <div class="micro" id="s1-micro">MacReady</div>
          <div class="wordmark" id="s1-title">Your Mac world.</div>
          <div class="tagline" id="s1-tag">One desktop.</div>
        </div>
      </section>

      <section id="scene-2" class="scene clip" data-start="3.2" data-duration="3.7" data-track-index="2">
        <div class="soft-bg bg-overview" id="s2-bg" data-layout-ignore></div>
        <div class="black-fade" id="s2-fade"></div>
        <div class="scene-content full-center">
          <div class="product-frame hero-frame" id="s2-frame">
            <img src="assets/screens/01-overview.png" alt="MacReady desktop overview" />
          </div>
          <div class="copy-line" id="s2-text">Built like a Mac app.</div>
          <div class="small-line" id="s2-sub">News, reviews, games, apps.</div>
        </div>
      </section>

      <section id="scene-3" class="scene clip" data-start="6.9" data-duration="3.2" data-track-index="3">
        <div class="soft-bg bg-overview" id="s3-bg" data-layout-ignore></div>
        <div class="black-fade" id="s3-fade"></div>
        <div class="crop-frame" id="s3-crop" data-layout-allow-overflow>
          <img src="assets/screens/01-news-detail.png" alt="MacReady news feed" data-layout-allow-overflow />
        </div>
        <div class="copy-line" id="s3-text">The day in Mac.</div>
        <div class="thread" id="s3-thread" style="left: 124px; top: 258px;"></div>
      </section>

      <section id="scene-4" class="scene clip" data-start="10.1" data-duration="3.3" data-track-index="4">
        <div class="soft-bg bg-games" id="s4-bg" data-layout-ignore></div>
        <div class="black-fade" id="s4-fade"></div>
        <div class="crop-frame" id="s4-crop" data-layout-allow-overflow>
          <img src="assets/screens/02-games.png" alt="MacReady games" data-layout-allow-overflow />
        </div>
        <div class="copy-line" id="s4-text">Know what plays.</div>
      </section>

      <section id="scene-5" class="scene clip" data-start="13.4" data-duration="3.3" data-track-index="5">
        <div class="soft-bg bg-apps" id="s5-bg" data-layout-ignore></div>
        <div class="black-fade" id="s5-fade"></div>
        <div class="crop-frame" id="s5-crop" data-layout-allow-overflow>
          <img src="assets/screens/03-app-store.png" alt="MacReady app discovery" data-layout-allow-overflow />
        </div>
        <div class="copy-line" id="s5-text">Find the apps that fit.</div>
      </section>

      <section id="scene-6" class="scene clip" data-start="16.7" data-duration="3.9" data-track-index="6" data-layout-allow-overflow>
        <div class="soft-bg bg-wallpaper" id="s6-bg" data-layout-ignore></div>
        <div class="black-fade" id="s6-fade"></div>
        <div class="crop-frame" id="s6-settings" data-layout-allow-overflow>
          <img src="assets/screens/04-wallpaper.png" alt="MacReady wallpaper settings" data-layout-allow-overflow />
        </div>
        <div class="crop-frame" id="s6-assistant" data-layout-allow-overflow>
          <img src="assets/screens/05-assistant.png" alt="MacReady assistant" data-layout-allow-overflow />
        </div>
      </section>

      <div id="s6-text" class="copy-line clip" data-start="16.7" data-duration="3.9" data-track-index="30">Make it yours.</div>

      <section id="scene-7" class="scene clip" data-start="20.6" data-duration="3.4" data-track-index="7">
        <div class="soft-bg bg-overview" id="s7-bg" data-layout-ignore></div>
        <div class="black-fade" id="s7-fade"></div>
        <div class="scene-content full-center">
          <div class="dock" id="s7-dock">
            <img src="assets/icons/news.webp" alt="" />
            <img src="assets/icons/steam.webp" alt="" />
            <img src="assets/icons/app-store.webp" alt="" />
            <img src="assets/icons/macos.webp" alt="" />
            <img src="assets/icons/settings.webp" alt="" />
          </div>
          <div class="wordmark" id="s7-title">MacReady</div>
          <div class="tagline" id="s7-tag">Ready for Mac.</div>
        </div>
      </section>

      <div id="veil" class="veil clip" data-start="0" data-duration="24" data-track-index="20"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      [3.2, 6.9, 10.1, 13.4, 16.7, 20.6].forEach(time => {
        tl.to("#veil", { opacity: 1, duration: 0.46, ease: "sine.inOut", overwrite: "auto" }, time - 0.46);
        tl.to("#veil", { opacity: 0, duration: 0.62, ease: "sine.inOut", overwrite: "auto" }, time + 0.03);
      });

      tl.from("#s1-bg", { opacity: 0, scale: 1.22, duration: 1.0, ease: "power2.out" }, 0.18);
      tl.from("#s1-fade", { opacity: 0, duration: 0.68, ease: "sine.out" }, 0.18);
      tl.from("#s1-micro", { opacity: 0, y: 24, duration: 0.48, ease: "power3.out" }, 0.5);
      tl.from("#s1-title", { opacity: 0, y: 44, scale: 0.98, duration: 0.72, ease: "expo.out" }, 0.74);
      tl.from("#s1-tag", { opacity: 0, y: 24, duration: 0.52, ease: "power2.out" }, 1.08);

      tl.from("#s2-bg", { opacity: 0, scale: 1.18, duration: 0.84, ease: "power2.out" }, 3.34);
      tl.from("#s2-fade", { opacity: 0, duration: 0.62, ease: "sine.out" }, 3.42);
      tl.from("#s2-frame", { opacity: 0, y: 72, scale: 0.88, duration: 0.86, ease: "expo.out" }, 3.62);
      tl.from("#s2-text", { opacity: 0, y: 38, duration: 0.56, ease: "power3.out" }, 4.32);
      tl.from("#s2-sub", { opacity: 0, y: 24, duration: 0.46, ease: "back.out(1.3)" }, 4.58);
      tl.to("#s2-frame", { y: -24, scale: 1.035, duration: 1.98, ease: "sine.inOut" }, 4.52);

      tl.from("#s3-bg", { opacity: 0, scale: 1.18, duration: 0.8, ease: "power2.out" }, 7.02);
      tl.from("#s3-fade", { opacity: 0, duration: 0.58, ease: "sine.out" }, 7.1);
      tl.from("#s3-crop", { opacity: 0, y: 62, scale: 0.92, duration: 0.76, ease: "expo.out" }, 7.26);
      tl.from("#s3-text", { opacity: 0, y: 36, duration: 0.56, ease: "power3.out" }, 7.58);
      tl.from("#s3-thread", { opacity: 0, scaleX: 0.1, transformOrigin: "left center", duration: 0.48, ease: "power2.out" }, 7.88);
      tl.to("#s3-crop img", { x: -78, scale: 1.12, duration: 2.35, ease: "sine.inOut" }, 7.7);

      tl.from("#s4-bg", { opacity: 0, scale: 1.18, duration: 0.8, ease: "power2.out" }, 10.24);
      tl.from("#s4-fade", { opacity: 0, duration: 0.58, ease: "sine.out" }, 10.32);
      tl.from("#s4-crop", { opacity: 0, x: -72, scale: 0.92, duration: 0.76, ease: "expo.out" }, 10.48);
      tl.from("#s4-text", { opacity: 0, y: 38, duration: 0.56, ease: "power3.out" }, 10.92);
      tl.to("#s4-crop img", { x: 92, scale: 1.13, duration: 2.45, ease: "sine.inOut" }, 10.76);

      tl.from("#s5-bg", { opacity: 0, scale: 1.18, duration: 0.8, ease: "power2.out" }, 13.54);
      tl.from("#s5-fade", { opacity: 0, duration: 0.58, ease: "sine.out" }, 13.62);
      tl.from("#s5-crop", { opacity: 0, y: -58, scale: 0.93, duration: 0.76, ease: "expo.out" }, 13.78);
      tl.from("#s5-text", { opacity: 0, y: 38, duration: 0.56, ease: "power3.out" }, 14.24);
      tl.to("#s5-crop img", { y: -70, scale: 1.12, duration: 2.35, ease: "sine.inOut" }, 14.04);

      tl.from("#s6-bg", { opacity: 0, scale: 1.18, duration: 0.8, ease: "power2.out" }, 16.84);
      tl.from("#s6-fade", { opacity: 0, duration: 0.58, ease: "sine.out" }, 16.92);
      tl.from("#s6-settings", { opacity: 0, x: -60, scale: 0.9, duration: 0.72, ease: "expo.out" }, 17.12);
      tl.from("#s6-assistant", { opacity: 0, x: 72, scale: 0.9, duration: 0.72, ease: "back.out(1.25)" }, 17.4);
      tl.from("#s6-text", { opacity: 0, y: 38, duration: 0.56, ease: "power3.out" }, 17.76);
      tl.to("#s6-settings img", { scale: 1.1, y: -38, duration: 2.6, ease: "sine.inOut" }, 17.52);
      tl.to("#s6-assistant img", { scale: 1.12, x: -44, duration: 2.4, ease: "sine.inOut" }, 17.72);

      tl.from("#s7-bg", { opacity: 0, scale: 1.18, duration: 0.8, ease: "power2.out" }, 20.74);
      tl.from("#s7-fade", { opacity: 0, duration: 0.58, ease: "sine.out" }, 20.82);
      tl.from("#s7-dock", { opacity: 0, y: 34, scale: 0.94, duration: 0.58, ease: "back.out(1.25)" }, 21.08);
      tl.from("#s7-title", { opacity: 0, y: 44, scale: 0.98, duration: 0.68, ease: "expo.out" }, 21.36);
      tl.from("#s7-tag", { opacity: 0, y: 26, duration: 0.48, ease: "power2.out" }, 21.72);
      tl.to("#s7-dock, #s7-title, #s7-tag", { opacity: 0, duration: 0.54, ease: "sine.inOut" }, 23.22);
      tl.to("#veil", { opacity: 1, duration: 0.6, ease: "sine.inOut", overwrite: "auto" }, 23.32);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
