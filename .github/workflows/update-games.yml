name: Update games data

on:
  schedule:
    - cron: "42 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Generate games JS
        run: npm run games:update
        env:
          MACREADY_STEAM_GAME_LIMIT: 80

      - name: Commit generated games JS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/games.generated.js
          git diff --cached --quiet || git commit -m "Update generated Steam game data"
          git push
